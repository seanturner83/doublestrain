[project]
name = "ssvc-triage"
version = "0.1.0"
description = "SSVC Act/Attend/Track grading for dependency advisories, with measured reachability judges (static analysis, local and hosted models) and a run harness"
readme = "README.md"
requires-python = ">=3.11"
# license = TBD
keywords = ["ssvc", "vulnerability", "triage", "reachability", "sca", "osv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
]
dependencies = []

[project.scripts]
ssvc-run = "ssvc_triage.harness.run:main"
ssvc-score = "ssvc_triage.harness.score:main"
ssvc-compare = "ssvc_triage.harness.compare:main"
ssvc-scan = "ssvc_triage.scan:main"
ssvc-shapes = "ssvc_triage.judges.shape:main"
ssvc-nofix = "ssvc_triage.nofix:main"
ssvc-watch = "ssvc_triage.watch:main"
ssvc-mitigate = "ssvc_triage.mitigate:main"
ssvc-usage = "ssvc_triage.accounting:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssvc_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
