[project]
name = "doublestrain"
version = "0.1.0"
description = "SSVC Act/Attend/Track grading for dependency advisories, with measured reachability judges (static analysis, local and hosted models) and a run harness"
readme = "README.md"
authors = [{ name = "Sean Turner" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ssvc", "vulnerability", "triage", "reachability", "sca", "osv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
]
dependencies = []

[project.scripts]
doublestrain = "doublestrain.cli:main"
ssvc-run = "doublestrain.harness.run:main"
ssvc-score = "doublestrain.harness.score:main"
ssvc-compare = "doublestrain.harness.compare:main"
ssvc-scan = "doublestrain.scan:main"
ssvc-shapes = "doublestrain.judges.shape:main"
ssvc-nofix = "doublestrain.nofix:main"
ssvc-watch = "doublestrain.watch:main"
ssvc-mitigate = "doublestrain.mitigate:main"
ssvc-usage = "doublestrain.accounting:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doublestrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
