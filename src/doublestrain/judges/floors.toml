# Acceptance floors per judge role and per model (`base.policy`).
#
# A verdict is handed to the grader only if its confidence clears the floor for its
# direction: `not_reachable` hides a risk when wrong, so its floor is the strict one.
# `inf` = never accepted (the tier escalates instead).
#
# Roles, from a verdict's source: jev, claude, split (claude spec + endpoint matcher),
# shape, and `endpoint` for every OpenAI-compatible tier (local, workstation, ...).
# A [[model]] entry overrides its role's defaults for the model that actually answered
# (the endpoint's model id, split's matcher model, shape's resolved claude model). A
# model with no entry gets its role's defaults: it has not been measured.
#
# corroborate = true: with the cascade's corroboration on (the default; SSVC_CORROBORATE=0
# or --no-corroborate turns it off), this model's accepted `not_reachable` settles nothing alone. A later
# tier in `corroborate_by` must also clear its own not_reachable floor; a reachable,
# unsure or missing second read leaves the row unresolved. For a model whose confidence
# doesn't separate its right answers from its wrong ones, a higher floor can't help:
# a second, independent read can. `split` reads the code on the same machine (claude
# sees the advisory only), so it is the second read that costs tokens, not privacy.
#
# SSVC_FLOOR_<TIER>_REACHABLE / _NOT_REACHABLE (tier name, e.g. WORKSTATION) still win.
# SSVC_FLOORS_FILE points at another file in this format.

[role.jev]
# Jev's confidence is a top-vs-runner-up margin: obvious cases ~1.0, dynamic dispatch
# ~0.0-0.4. It sees that the app uses a package, not whether attacker input reaches it
# (NodeGoat + DVWS: accepted reachables 4 right / 10 wrong), so reachable never settles.
reachable = inf
not_reachable = 0.9

[role.claude]
# self-reported, and it has read the code; the last tier, so below the floor the row
# stays unresolved
reachable = 0.5
not_reachable = 0.7

[role.endpoint]
# self-reported by a small model, poorly calibrated: Jev-strength floors, reachable never
# settles, and an unmeasured model needs a second read
reachable = inf
not_reachable = 0.9
corroborate = true
corroborate_by = ["jelly", "pyimports", "cargofeat", "split", "shape", "claude"]

[role.govulncheck]
# a call graph, not a model: called -> reachable 1.0, only imported / required ->
# not_reachable 1.0, and `unsure` where cgo files were left out of the analysis
reachable = 0.5
not_reachable = 0.9

[role.jelly]
# a static analysis of which npm packages the app's code can load (judges/jelly.py):
# not_reachable 1.0 when the advisory's package is never loaded and no guard fires;
# a loaded package is `unsure` (package level says nothing about the function), so
# reachable never comes from here. all10 prototype (2026-10-19, the guard designed on
# the same apps): 336 of 844 not_reachable labels, 0 of 97 reachable labels. Until a
# held-out measurement, a second read must agree; an endpoint model counts (mutual:
# endpoint lists jelly), since the two fail in different ways.
reachable = inf
not_reachable = 0.9
corroborate = true
corroborate_by = ["endpoint", "split", "shape", "claude"]

[role.pyimports]
# the Python import graph (judges/pyimports.py), distribution level: not_reachable 1.0
# when the advisory's distribution is never imported and no guard fires; imported ->
# `unsure`. Unmeasured (pip is held by SSVC_NR_UNMEASURED), so a second read must agree,
# mutually with an endpoint model, as for jelly.
reachable = inf
not_reachable = 0.9
corroborate = true
corroborate_by = ["endpoint", "split", "shape", "claude"]

[role.cargofeat]
# Cargo feature resolution over the manifests (doublestrain/cargofeat.py), crate level:
# not_reachable 1.0 when the locked crate isn't compiled into the binary the image builds;
# compiled -> `unsure`. rs1 (2026-10-26, built after reading those labels, so not a
# measurement): 49 of 256 not_reachable labels, 0 of 27 reachable. Unmeasured, and cargo is
# held: a second read must agree, mutually with an endpoint model, as for jelly.
reachable = inf
not_reachable = 0.9
corroborate = true
corroborate_by = ["endpoint", "split", "shape", "claude"]

[role.split]
# six-app run: matcher 0.90s 6 right / 1 wrong (goof dustjs) against 77 / 0 at >= 0.95
reachable = inf
not_reachable = 0.95
# Ecosystems held for every model tier (SSVC_NR_UNMEASURED, default cargo,go,pypi,maven) where this
# role's not_reachable may still settle: go5-split-raw (2026-10-18, five Go apps, 145
# blind labels): not_reachable 128 right / 0 wrong, reachable 6/6 on reachable labels.
# pypi only as a pair (corroborate_ecosystems): split's not_reachable >= 0.95 settles when
# claude's (opus for pypi) >= 0.7 agrees. Held-out py8 (2026-10-26, five apps, 564 blind
# labels, re-reviewed): 260 right / 0 wrong; py7 (dev) 261 / 1 before approots. Split
# alone was 277 / 3 there, so alone it still settles nothing; claude alone is unmeasured
# (it was asked only on split's not_reachable rows) and stays held.
# cargo likewise only as the pair (opus for cargo). rs1 dev 159 / 0; held-out rs2 155 / 1
# (Kellnr gix-worktree, reachable only with the opt-in docs.enabled; accepted as an edge
# case, 2026-10-27) and rs3 166 / 0 (2026-10-27), all re-reviewed blind. Split
# alone was 164 / 1, 172 / 2 and 174 / 5, so alone it still settles nothing on cargo.
# maven likewise only as the pair, with split's floor at 0.90 there (the jvmcallers notes make
# split say 0.90 where it said 0.95). jv2 (re-run as a dev set after the call-graph fixes) 327 / 0
# at 0.90; held-out jv3 (2026-10-29, five apps, 306 blind labels, re-reviewed) 159 / 1, coverage
# 0.619: the miss a deserialization gadget, which reach.py now never lets settle on maven.
measured_ecosystems = ["go", "pypi", "cargo", "maven"]
corroborate_ecosystems = ["pypi", "cargo", "maven"]
not_reachable_by_ecosystem = { maven = 0.90 }
corroborate_by = ["claude"]

[role.shape]
reachable = inf
not_reachable = 0.9

[[model]]
role = "endpoint"
model = "qwen/qwen3.8-27b"
not_reachable = 0.9
corroborate = true
# Its confidence carries little signal: it answers 0.90 or 0.95. all10-r4 not_reachable
# >= 0.90: 434 right / 2 wrong, both at 0.95 (qs nodegoat, serve-static sirappsec);
# all10-r5 adds serve-static nodegoat at 0.90. Raising the floor to 0.95 would catch
# one miss of three.
measured = "all10-r4, all10-r5 (2026-10-17)"

[[model]]
role = "split"
model = "qwen/qwen3.8-27b"
not_reachable = 0.95
# all10-r4 >= 0.95: 152 right / 5 wrong, every miss after a workstation reachable
# (SSVC_ESCALATE_DISAGREEMENT catches them)
measured = "all10-r4 (2026-10-17)"

[[model]]
role = "shape"
model = "claude-opus-5-5"
# Opus 5.5 reports lower confidence than Sonnet for the same separation (README,
# "Call shapes"). all10-r5: not_reachable at 0.80 20 right / 2 wrong (sirappsec
# sequelize, sqlite3: rows the disagreement toggle had sent on from split), >= 0.85
# 135 right / 0 wrong. Was 0.8.
not_reachable = 0.85
measured = "six-app run, all10-r4, all10-r5 (2026-10-17)"

[[model]]
role = "shape"
model = "claude-sonnet-5-5"
not_reachable = 0.9
measured = "six-app run"
